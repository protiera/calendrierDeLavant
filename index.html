<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04263f">
<title>Calendrier de l'Avent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--ui:"Segoe UI","Open Sans",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:var(--ui);color:#fff;min-height:100dvh;overflow-x:hidden;padding-bottom:calc(120px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,#021a33 0%,#04365a 28%,#0a6d8c 58%,#3cc0d6 82%,#c8f4ff 100%);background-attachment:fixed}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg svg{position:absolute;left:-10%;width:120%;height:100%}
.bokeh{position:absolute;border-radius:50%;animation:float 14s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-22px)}}
.bubble{position:absolute;border-radius:50%;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.95) 0 6%,rgba(255,255,255,.25) 14%,rgba(160,240,255,.08) 45%,rgba(120,220,255,.25) 80%,rgba(255,255,255,.55) 100%);
  box-shadow:inset 0 0 12px rgba(255,255,255,.35),0 6px 20px rgba(0,40,80,.25);animation:float 11s ease-in-out infinite}
#snow{position:fixed;inset:0;pointer-events:none;z-index:2}
.deco{position:absolute;left:0;right:0;top:0;height:300px;overflow:hidden;z-index:1;pointer-events:none}
.garland{position:absolute;left:0;top:0;width:100%;height:70px}
.bulb{animation:bl 1.6s steps(1) infinite}.bulb.b2{animation-delay:.8s}
@keyframes bl{50%{opacity:.3}}
.bauble{position:absolute;top:0;display:flex;flex-direction:column;align-items:center;transform-origin:top center;animation:swing 4.5s ease-in-out infinite}
.bauble .str{width:1px;background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,.75))}
.bauble .cap{width:30%;height:6px;border-radius:2px;background:linear-gradient(90deg,#9aa9b8,#fff 45%,#a9b8c8)}
.bauble .ball{border-radius:50%;margin-top:-1px;box-shadow:inset 0 0 14px rgba(255,255,255,.4),0 8px 22px rgba(0,20,50,.4)}
.ball.red{background:radial-gradient(circle at 30% 25%,#fff 0 7%,rgba(255,170,170,.9) 14%,rgba(220,20,50,.8) 45%,rgba(120,0,20,.9) 80%,rgba(255,120,140,.9) 100%)}
.ball.green{background:radial-gradient(circle at 30% 25%,#fff 0 7%,rgba(190,255,200,.9) 14%,rgba(40,200,110,.8) 45%,rgba(0,90,50,.9) 80%,rgba(120,255,180,.9) 100%)}
.ball.glass{background:radial-gradient(circle at 30% 25%,#fff 0 7%,rgba(255,255,255,.35) 15%,rgba(150,230,255,.12) 50%,rgba(120,220,255,.35) 85%,rgba(255,255,255,.7) 100%)}
.ball.gold{background:radial-gradient(circle at 30% 25%,#fff 0 7%,rgba(255,240,180,.95) 14%,rgba(240,190,40,.85) 45%,rgba(140,90,0,.9) 80%,rgba(255,220,120,.95) 100%)}
@keyframes swing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
main{position:relative;z-index:3;max-width:720px;margin:0 auto;padding:max(70px,calc(env(safe-area-inset-top) + 50px)) 14px 24px}
.head{text-align:center}
.head .kick{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#bff3ff;text-shadow:0 0 10px rgba(120,230,255,.8)}
.head h1{margin:6px 0 0;font-weight:300;font-size:clamp(34px,9.5vw,60px);line-height:1.05;letter-spacing:-.01em;
  background:linear-gradient(180deg,#fff 0%,#fff 48%,#bdefff 52%,#e9fbff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(140,230,255,.6)) drop-shadow(0 2px 2px rgba(0,30,60,.5))}
/* gadget (compte à rebours) */
.gadget{margin:18px auto 0;width:max-content;max-width:100%;display:flex;align-items:center;gap:12px;padding:10px 16px 10px 12px;border-radius:14px;position:relative;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.08) 50%,rgba(0,20,40,.18) 51%,rgba(255,255,255,.1));
  border:1px solid rgba(255,255,255,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 8px 24px rgba(0,20,50,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.gadget .orb{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:18px;
  background:radial-gradient(circle at 50% 30%,#fff 0 8%,#9ff0ff 20%,#16a6d9 55%,#04517a 100%);box-shadow:inset 0 -3px 6px rgba(0,0,0,.3),0 0 12px rgba(120,230,255,.7)}
.gadget .txt{font-size:14px;text-shadow:0 1px 2px rgba(0,30,60,.6)}
.gadget .txt b{display:block;font-weight:600;font-size:16px}
/* icônes bulles */
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px 6px;margin-top:26px}
.ico{background:none;border:0;padding:2px 0;font:inherit;color:inherit;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;border-radius:10px}
.orbi{position:relative;width:58px;height:58px;border-radius:50%;
  background:radial-gradient(circle at 50% 120%,rgba(120,255,220,.85) 0%,rgba(30,170,210,.75) 40%,rgba(10,80,140,.85) 75%,rgba(4,40,80,.9) 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),inset 0 -6px 12px rgba(160,255,240,.5),0 6px 16px rgba(0,20,50,.45),0 0 0 3px rgba(255,255,255,.08)}
.orbi::before{content:"";position:absolute;left:12%;right:12%;top:5%;height:46%;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;
  background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.15));z-index:2;pointer-events:none}
.orbi .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:600;z-index:1;text-shadow:0 1px 3px rgba(0,30,60,.8)}
.orbi .cov{position:absolute;inset:3px;border-radius:50%;overflow:hidden;z-index:1}
.ico:nth-child(odd) .orbi:not(.open){background:radial-gradient(circle at 50% 120%,rgba(255,150,160,.9) 0%,rgba(220,40,60,.8) 40%,rgba(120,0,25,.9) 78%,rgba(60,0,10,.95) 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),inset 0 -6px 12px rgba(255,170,170,.5),0 6px 16px rgba(0,20,50,.45)}
.ico:nth-child(even) .orbi:not(.open){background:radial-gradient(circle at 50% 120%,rgba(170,255,190,.9) 0%,rgba(30,180,90,.8) 40%,rgba(0,90,45,.9) 78%,rgba(0,45,20,.95) 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),inset 0 -6px 12px rgba(170,255,200,.5),0 6px 16px rgba(0,20,50,.45)}
.ico.bonus .orbi:not(.open){background:radial-gradient(circle at 50% 120%,rgba(255,245,190,.95) 0%,rgba(240,190,40,.85) 40%,rgba(140,90,0,.9) 78%,rgba(80,50,0,.95) 100%)}
.ico.locked .orbi{filter:saturate(.25) brightness(.85);opacity:.75}
.ico.locked .orbi .num{opacity:.75}
.ico.locked .lockb{position:absolute;right:-3px;bottom:-3px;z-index:3;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;
  background:linear-gradient(180deg,#f4f7fa,#b9c4cf);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.ico.today .orbi{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:inset 0 0 0 1px rgba(255,255,255,.7),0 0 0 0 rgba(140,240,255,.7),0 6px 16px rgba(0,20,50,.45)}50%{box-shadow:inset 0 0 0 1px rgba(255,255,255,.7),0 0 0 9px rgba(140,240,255,0),0 6px 16px rgba(0,20,50,.45)}}
.lbl{font-size:11.5px;padding:1px 7px;border-radius:4px;white-space:nowrap;text-shadow:0 1px 3px rgba(0,20,50,.9)}
.ico.today .lbl{background:linear-gradient(180deg,rgba(190,240,255,.55),rgba(90,190,240,.35));box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)}
.ico:focus-visible{outline:1px solid rgba(255,255,255,.8);outline-offset:2px}
.ground{position:fixed;left:0;right:0;bottom:calc(46px + env(safe-area-inset-bottom));height:120px;z-index:1;pointer-events:none}
/* barre des tâches verre */
.task{position:fixed;left:0;right:0;bottom:0;height:calc(46px + env(safe-area-inset-bottom));padding:0 10px env(safe-area-inset-bottom) 6px;display:flex;align-items:center;gap:10px;z-index:20;
  background:linear-gradient(180deg,rgba(60,70,80,.75) 0%,rgba(20,24,30,.82) 50%,rgba(0,0,0,.88) 51%,rgba(10,14,20,.9) 100%);
  border-top:1px solid rgba(255,255,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.15);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.start{position:relative;width:44px;height:44px;margin-top:-6px;border-radius:50%;border:0;padding:0;cursor:pointer;font-size:19px;
  background:radial-gradient(circle at 50% 115%,#7dffb0 0%,#22c46a 30%,#0a6a3a 62%,#032a18 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.55),0 0 0 2px rgba(0,0,0,.6),0 0 14px rgba(110,255,170,.55)}
.start::before{content:"";position:absolute;left:10%;right:10%;top:4%;height:48%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.1))}
.start span{position:relative;z-index:1}
.task .st{flex:1;min-width:0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:7px 12px;border-radius:4px;
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.06) 50%,rgba(255,255,255,0) 51%,rgba(255,255,255,.08));box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.tray{font-size:12px;text-align:center;line-height:1.2;opacity:.95}
/* fenêtres Aero */
.layer{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(0,15,35,.35)}
.layer.open{display:flex}
.win{width:100%;max-width:430px;max-height:calc(100dvh - 28px);display:flex;flex-direction:column;border-radius:9px;overflow:hidden;color:#0b1b2b;
  background:linear-gradient(180deg,rgba(120,180,220,.55),rgba(60,110,160,.55));border:1px solid rgba(0,0,0,.65);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.55),0 20px 60px rgba(0,10,30,.6);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.94) translateY(6px);opacity:0}}
.bar{position:relative;display:flex;align-items:center;gap:8px;height:34px;padding:0 6px 0 12px;color:#fff;font-size:13.5px;text-shadow:0 0 8px rgba(255,255,255,.9),0 1px 1px rgba(0,0,0,.6)}
.bar::before{content:"";position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,.05));pointer-events:none}
.bar .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.bar .ctl{display:flex;position:relative;align-self:flex-start;border:1px solid rgba(0,0,0,.6);border-top:0;border-radius:0 0 5px 5px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.45)}
.bar .ctl span,.bar .ctl button{width:26px;height:19px;display:flex;align-items:center;justify-content:center;font:11px var(--ui);color:#fff;border:0;padding:0;
  background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,.1) 50%,rgba(0,0,0,.05) 51%,rgba(255,255,255,.15))}
.bar .ctl button{width:44px;cursor:pointer;background:linear-gradient(180deg,#f2a49a 0%,#d9533f 50%,#b8250f 51%,#e2704f 100%);font-weight:700;font-size:12px}
.body{margin:0 6px 6px;border-radius:3px;background:#fff;border:1px solid rgba(0,0,0,.35);overflow:auto;padding:14px;font-size:13.5px}
.prog{height:16px;margin:12px 0 8px;border-radius:3px;border:1px solid #8a9aa8;background:linear-gradient(180deg,#e9edf0,#fafbfc);overflow:hidden;position:relative}
.prog i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(180deg,#b6f4a8 0%,#42d23a 45%,#1fa31a 55%,#5ee056 100%);transition:width .1s linear;overflow:hidden}
.prog i::after{content:"";position:absolute;top:0;bottom:0;width:60px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);animation:shine 1.2s linear infinite}
@keyframes shine{from{left:-60px}to{left:100%}}
.cover{position:relative;width:100%;aspect-ratio:1;border-radius:4px;overflow:hidden;background:#123;box-shadow:0 4px 14px rgba(0,30,60,.35)}
.cover::after{content:"";position:absolute;left:0;right:0;top:0;height:42%;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0));pointer-events:none;z-index:2}
.meta .al{font-size:20px;font-weight:300;color:#1e3f5a;margin-top:14px;line-height:1.2}
.meta .ar{font-size:14px;color:#2a7fb8;margin-top:3px;font-weight:600}
.meta .tx{margin:10px 0 0;line-height:1.55;color:#2b3b48}
.foot{display:flex;justify-content:flex-end;gap:8px;margin:0 6px 6px;padding:8px;border-radius:3px;background:#eef3f7;border:1px solid rgba(0,0,0,.2)}
.btn{min-width:86px;height:26px;font:13px var(--ui);color:#111;border-radius:3px;border:1px solid #707070;cursor:pointer;
  background:linear-gradient(180deg,#f2f2f2 0%,#ebebeb 50%,#dddddd 51%,#cfcfcf 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.8)}
.btn:focus-visible{border-color:#3c7fb1;box-shadow:inset 0 0 0 1px #9fd9f6}
.err{display:flex;gap:12px;align-items:flex-start;color:#1e3f5a}
.err .ic{flex:none;width:36px;height:36px;border-radius:50%;color:#fff;font:700 18px var(--ui);display:flex;align-items:center;justify-content:center;position:relative;
  background:radial-gradient(circle at 50% 110%,#ff9a8a 0%,#e0241b 50%,#8d0b05 100%);box-shadow:0 2px 5px rgba(0,0,0,.35)}
.err .ic::before{content:"";position:absolute;left:12%;right:12%;top:4%;height:45%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.05))}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.bauble,.bulb,.bokeh,.bubble,.ico.today .orbi,.prog i::after{animation:none}#snow{display:none}}
</style>
</head>

<div class="deco" id="deco" aria-hidden="true"></div>
<canvas id="snow"></canvas>
<svg class="ground" viewBox="0 0 400 120" preserveAspectRatio="none" aria-hidden="true">
  <defs><linearGradient id="sn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d7f2ff"/></linearGradient></defs>
  <path d="M0 64 Q70 34 150 56 T300 48 T400 44 V120 H0Z" fill="#bfe9ff" opacity=".85"/>

<div class="layer" id="layer"><div class="win" id="win" role="dialog" aria-modal="true"></div></div>

  var top=null,s=-1;(list||[]).forEach(function(r){var g=get(r);if(!g.url)return;var v=score(item,g.artist,g.album);if(v>s){s=v;top=g.url}});
  return s>=4?top:null;
}
var SOURCES=[
  function(item,term,cb){jsonp("https://api.deezer.com/search/album?output=jsonp&limit=25&q="+encodeURIComponent(term),"callback",function(r){
    cb(best(r&&r.data,item,function(x){return{artist:x.artist&&x.artist.name,album:x.title,url:x.cover_xl||x.cover_big}}))})},
  function(item,term,cb){jsonp("https://itunes.apple.com/search?entity=album&limit=25&term="+encodeURIComponent(term),"callback",function(r){
    cb(best(r&&r.results,item,function(x){return{artist:x.artistName,album:x.collectionName,url:x.artworkUrl100&&x.artworkUrl100.replace(/\/\d+x\d+bb\./,"/600x600bb.")}}))})}
];
function lookup(item,cb){
  var terms=[item.artist+" "+clean(item.album),clean(item.album)],steps=[];
  SOURCES.forEach(function(src){terms.forEach(function(t){steps.push([src,t])})});
  (function next(i){if(i>=steps.length)return cb(null);steps[i][0](item,steps[i][1],function(u){if(u)cb(u);else next(i+1)})})(0);
}
var coverCache={},pending={},coverLog={};
function getCover(day,cb){
  var item=DATA[day-1];
  if(coverCache[day])return cb(coverCache[day]);
  if(pending[day])return pending[day].push(cb);
  pending[day]=[cb];
  function finish(u,src){coverLog[day]=u?src:"échec";if(u)coverCache[day]=u;var l=pending[day];delete pending[day];l.forEach(function(f){f(u||null)});debugCovers()}
  var local="covers/"+String(day).padStart(2,"0")+".jpg",img=new Image();
  img.onload=function(){finish(local,"local")};
  img.onerror=function(){
    var key="cover-"+norm(item.artist+item.album),cached=sget(key);
    if(cached)return finish(cached,"cache");
    lookup(item,function(u){if(u)sset(key,u);finish(u,"en ligne")});
  };
  img.src=local;
}
function fillCover(box,day,small){
  var item=DATA[day-1];
  box.innerHTML="";box.appendChild(fallbackArt(item,small));
  getCover(day,function(url){
    if(!url)return;
    var im=new Image();im.alt=item.album+" — "+item.artist;
    im.style.cssText="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block";
    im.onload=function(){box.innerHTML="";box.appendChild(im)};
    im.onerror=function(){coverLog[day]="image illisible";debugCovers()};
    im.src=url;
  });
}
