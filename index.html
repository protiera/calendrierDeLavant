<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Calendrier de l'Avent — 25 albums</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1020; --bg2:#141a33; --ink:#f3ecdc; --muted:#9aa3c0;
  --gold:#e9b949; --red:#c8423b; --door:#1b2347; --door2:#232c58; --line:rgba(243,236,220,.12);
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100dvh;background:
  radial-gradient(1200px 600px at 50% -10%, #23305f 0%, transparent 60%),
  radial-gradient(800px 400px at 100% 100%, #1a1430 0%, transparent 60%), var(--bg)}
#snow{position:fixed;inset:0;pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 16px 48px}
header{text-align:center;margin-bottom:22px}
.kicker{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(30px,7vw,48px);line-height:1.05;margin:8px 0 10px}
.sub{color:var(--muted);font-size:15px;margin:0}
.status{margin:14px auto 0;display:inline-block;padding:7px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(6px,1.8vw,12px);margin-top:22px}
.door{position:relative;aspect-ratio:1;border:0;padding:0;cursor:pointer;border-radius:12px;perspective:600px;background:transparent;color:inherit;font:inherit}
.door .face{position:absolute;inset:0;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,var(--door2),var(--door));box-shadow:inset 0 0 0 1px var(--line),0 6px 16px rgba(0,0,0,.35);
  transform-origin:left center;transition:transform .7s cubic-bezier(.3,.7,.2,1),opacity .7s;backface-visibility:hidden;z-index:2}
.door .num{font-family:var(--serif);font-weight:700;font-size:clamp(20px,5.5vw,34px);color:var(--ink)}
.door .lock{position:absolute;bottom:6px;right:7px;font-size:11px;opacity:.55}
.door .behind{position:absolute;inset:0;border-radius:12px;overflow:hidden;background:#05070f;box-shadow:inset 0 0 0 1px var(--line)}
.door .behind img{width:100%;height:100%;object-fit:cover;display:block}
.door.locked .face{background:linear-gradient(145deg,#161c3a,#11162d)}
.door.locked .num{color:#5d6690}
.door.today .face{box-shadow:inset 0 0 0 2px var(--gold),0 0 22px rgba(233,185,73,.35)}
.door.today .num{color:var(--gold)}
.door.opened .face{transform:rotateY(-105deg);opacity:.0}
.door.bonus .face{background:linear-gradient(145deg,#4a1d24,#2a1018)}
.door.bonus.locked .face{background:linear-gradient(145deg,#2a1419,#1a0c10)}
.door.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.door:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:#f3ecdc;color:#0b1020;
  padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;transition:.25s;z-index:30;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* modal */
.modal{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;background:rgba(4,6,14,.72);backdrop-filter:blur(6px)}
.modal.open{display:flex}
.sheet{width:100%;max-width:520px;max-height:92dvh;overflow:auto;background:var(--bg2);border-radius:20px 20px 0 0;padding:18px 18px max(22px,env(safe-area-inset-bottom));
  box-shadow:0 -10px 40px rgba(0,0,0,.5);animation:up .35s cubic-bezier(.3,.7,.2,1)}
@media(min-width:640px){.modal{align-items:center}.sheet{border-radius:20px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet .day{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.close{background:transparent;border:1px solid var(--line);color:var(--ink);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer}
.cover{position:relative;width:100%;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#05070f;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.art{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;color:rgba(255,255,255,.9);text-align:center;padding:12%;line-height:1.05}
.meta h2{font-family:var(--serif);font-size:26px;line-height:1.15;margin:16px 0 4px}
.meta .artist{font-size:16px;color:var(--gold);font-weight:600}
.meta .year{color:var(--muted);font-size:14px;margin-left:6px;font-weight:400}
.meta p{font-size:15.5px;line-height:1.55;color:#d9d3c4;margin:14px 0 0}
footer{margin-top:26px;text-align:center;color:var(--muted);font-size:12px}
/* debug */
.debug{position:relative;z-index:2;margin:0 auto 18px;max-width:760px;border:1px dashed #e9b94966;border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.debug b{color:var(--gold)}
.debug input,.debug button{font:inherit;font-size:13px;background:#0b1020;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.debug button{cursor:pointer}
</style>
</head>
<body>
<canvas id="snow"></canvas>
<main>
  <div id="debug"></div>
  <header>
    <div class="kicker">Décembre 2026 · 25 albums</div>
    <h1>Calendrier de l'Avent</h1>
    <p class="sub">Une case par jour, un album à découvrir.</p>
    <div class="status" id="status"></div>
  </header>
  <div class="grid" id="grid"></div>
  <footer>Albums choisis d'après l'historique last.fm.</footer>
</main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
  <div class="sheet">
    <div class="top"><span class="day" id="m-day"></span><button class="close" id="m-close" aria-label="Fermer">×</button></div>
    <div class="cover" id="m-cover"></div>
    <div class="meta">
      <h2 id="m-title"></h2>
      <div class="artist"><span id="m-artist"></span><span class="year" id="m-year"></span></div>
      <p id="m-text"></p>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

function decode(b64,key){

function saveOpened(){sset("opened",JSON.stringify(opened))}

/* ---------- date ---------- */
var override=null;
if(TEST){var q=new URLSearchParams(location.search).get("date");if(q)override=q;else if(sget("date"))override=sget("date");}
function today(){
  if(override){var p=override.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
  var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());
}
var forceAll=TEST&&sget("all")==="1";
function unlocked(d){return forceAll||today()>=new Date(YEAR,11,d)}
function daysUntil(d){return Math.round((new Date(YEAR,11,d)-today())/864e5)}

/* ---------- pochettes ---------- */
function norm(s){return(s||"").normalize("NFKD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"")}
function hash(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}
function clean(s){return(s||"").replace(/\(.*?\)|\[.*?\]/g," ").replace(/\s+-\s+.*$/," ").replace(/\s+/g," ").trim()}
function fallbackArt(item,small){
  var h=hash(item.artist+item.album)%360,el=document.createElement("div");
  el.className="art";
  el.style.background="linear-gradient(135deg,hsl("+h+",55%,38%),hsl("+((h+60)%360)+",60%,18%))";
  el.style.fontSize=small?"11px":"clamp(22px,7vw,34px)";
  el.textContent=small?"":item.album;
  return el;
}
/* JSONP sérialisé : une requête à la fois, espacées, pour ne pas déclencher les limites de débit */
var jsonpN=0,queue=[],busy=false;
function jsonp(url,cbParam,cb){queue.push([url,cbParam,cb]);pump()}
function pump(){
  if(busy||!queue.length)return;busy=true;
  var job=queue.shift(),name="__cb"+(jsonpN++),s=document.createElement("script"),done=false;
  var t=setTimeout(function(){fin(null)},7000);
  function fin(r){if(done)return;done=true;clearTimeout(t);window[name]=function(){};s.remove();
    try{job[2](r)}catch(e){}setTimeout(function(){busy=false;pump()},250)}
  window[name]=function(r){fin(r)};
  s.onerror=function(){fin(null)};
  s.src=job[0]+(job[0].indexOf("?")<0?"?":"&")+job[1]+"="+name;
  document.head.appendChild(s);
}
function score(item,artist,album){
  var a=norm(item.artist),b=norm(clean(item.album)),ra=norm(artist),rb=norm(clean(album)),sc=0;
  if(ra===a)sc+=3;else if(ra&&(ra.indexOf(a)>=0||a.indexOf(ra)>=0))sc+=2;
  if(rb===b)sc+=3;else if(rb&&b&&(rb.indexOf(b)>=0||b.indexOf(rb)>=0))sc+=2;
  return sc;
}
function best(list,item,get){
  var top=null,s=-1;(list||[]).forEach(function(r){var g=get(r);if(!g.url)return;var v=score(item,g.artist,g.album);if(v>s){s=v;top=g.url}});
  return s>=4?top:null;
}
var SOURCES=[
  function(item,term,cb){jsonp("https://api.deezer.com/search/album?output=jsonp&limit=25&q="+encodeURIComponent(term),"callback",function(r){
    cb(best(r&&r.data,item,function(x){return{artist:x.artist&&x.artist.name,album:x.title,url:x.cover_xl||x.cover_big}}))})},
  function(item,term,cb){jsonp("https://itunes.apple.com/search?entity=album&limit=25&term="+encodeURIComponent(term),"callback",function(r){
    cb(best(r&&r.results,item,function(x){return{artist:x.artistName,album:x.collectionName,url:x.artworkUrl100&&x.artworkUrl100.replace(/\/\d+x\d+bb\./,"/600x600bb.")}}))})}
];
function lookup(item,cb){
  var terms=[item.artist+" "+clean(item.album),clean(item.album)],steps=[];
  SOURCES.forEach(function(src){terms.forEach(function(t){steps.push([src,t])})});
  (function next(i){
    if(i>=steps.length)return cb(null);
    steps[i][0](item,steps[i][1],function(u){if(u)cb(u);else next(i+1)});
  })(0);
}
var coverCache={},pending={},coverLog={};
function getCover(day,item,cb){
  if(coverCache[day])return cb(coverCache[day]);
  if(pending[day])return pending[day].push(cb);
  pending[day]=[cb];
  function finish(u,src){coverLog[day]=u?src:"échec";if(u)coverCache[day]=u;var l=pending[day];delete pending[day];l.forEach(function(f){f(u||null)});if(TEST)debugCovers()}
  var local="covers/"+String(day).padStart(2,"0")+".jpg",img=new Image();
  img.onload=function(){finish(local,"local")};
  img.onerror=function(){
    var key="cover-"+norm(item.artist+item.album),cached=sget(key);
    if(cached)return finish(cached,"cache");
    lookup(item,function(u){if(u)sset(key,u);finish(u,"en ligne")});
  };
  img.src=local;
}
function fillCover(box,day,item,small){
  box.innerHTML="";box.appendChild(fallbackArt(item,small));
  getCover(day,item,function(url){
    if(!url)return;
    var im=new Image();im.alt=item.album+" — "+item.artist;
    im.onload=function(){box.innerHTML="";box.appendChild(im)};
    im.onerror=function(){coverLog[day]="image illisible";if(TEST)debugCovers()};
    im.src=url;
  });
}
function debugCovers(){
  var el=document.getElementById("dbg-covers");if(!el)return;
  var ks=Object.keys(coverLog).sort(function(a,b){return a-b});
  el.textContent=ks.length?"Pochettes : "+ks.map(function(k){return k+"="+coverLog[k]}).join(" · "):"";
}

/* ---------- rendu ---------- */
var grid=document.getElementById("grid"),doors=[];
function render(){
  grid.innerHTML="";doors=[];
  var t=today();
  for(var d=1;d<=25;d++){(function(d){
    var item=DATA[d-1],b=document.createElement("button");
    b.className="door"+(d===25?" bonus":"");
    var un=unlocked(d),isToday=t.getFullYear()===YEAR&&t.getMonth()===11&&t.getDate()===d;
    if(!un)b.classList.add("locked");
    if(isToday)b.classList.add("today");
    b.setAttribute("aria-label",un?"Jour "+d:"Jour "+d+", verrouillé");
    var behind=document.createElement("div");behind.className="behind";
    var face=document.createElement("div");face.className="face";
    face.innerHTML='<span class="num">'+(d===25?"★":d)+'</span>'+(un?"":'<span class="lock">🔒</span>');
    b.appendChild(behind);b.appendChild(face);
    if(un&&opened[d]){b.classList.add("opened");fillCover(behind,d,item,true)}
    b.addEventListener("click",function(){
      if(!unlocked(d)){
        b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");
        var n=daysUntil(d);toast(n===1?"Demain !":"Encore "+n+" jours");return;
      }
      if(!opened[d]){opened[d]=1;saveOpened();fillCover(behind,d,item,true);b.classList.add("opened");setTimeout(function(){openModal(d)},550)}
      else openModal(d);
    });
    grid.appendChild(b);doors.push(b);
  })(d)}
  status();
}
function status(){
  var el=document.getElementById("status"),t=today(),start=new Date(YEAR,11,1),end=new Date(YEAR,11,25);
  if(forceAll)el.textContent="Mode test : tout est débloqué";
  else if(t<start){var n=daysUntil(1);el.textContent="Ouverture dans "+n+" jour"+(n>1?"s":"")+" · 1er décembre"}
  else if(t<=end){var d=t.getDate();el.textContent=(d===25?"Joyeux Noël · case bonus ouverte":"Aujourd'hui : case "+d)}
  else el.textContent="Toutes les cases sont ouvertes";
}
var modal=document.getElementById("modal"),lastFocus=null;
function openModal(d){
  var item=DATA[d-1];lastFocus=document.activeElement;
  document.getElementById("m-day").textContent=d===25?"25 décembre · bonus":d+" décembre";
  document.getElementById("m-title").textContent=item.album;
  document.getElementById("m-artist").textContent=item.artist;
  document.getElementById("m-year").textContent=item.year?"· "+item.year:"";
  document.getElementById("m-text").textContent=item.text||"";
  fillCover(document.getElementById("m-cover"),d,item,false);
  modal.classList.add("open");document.body.style.overflow="hidden";
  document.getElementById("m-close").focus();
}
function closeModal(){modal.classList.remove("open");document.body.style.overflow="";if(lastFocus)lastFocus.focus()}
document.getElementById("m-close").addEventListener("click",closeModal);
modal.addEventListener("click",function(e){if(e.target===modal)closeModal()});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&modal.classList.contains("open"))closeModal()});
var tt;function toast(m){var el=document.getElementById("toast");el.textContent=m;el.classList.add("show");clearTimeout(tt);tt=setTimeout(function(){el.classList.remove("show")},1600)}

/* ---------- panneau de test ---------- */
if(TEST){
  var dbg=document.getElementById("debug");dbg.className="debug";
  dbg.innerHTML='<b>V1 TEST · fausses données</b> Date simulée <input type="date" id="dbg-date"> '+
    '<button id="dbg-all"></button><button id="dbg-reset">Refermer les cases</button><button id="dbg-real">Date réelle</button><button id="dbg-clear">Vider le cache pochettes</button><div id="dbg-covers" style="flex-basis:100%;font-size:12px"></div>';
  var di=document.getElementById("dbg-date");di.value=override||"";
  var ba=document.getElementById("dbg-all");ba.textContent=forceAll?"Verrouiller selon la date":"Tout débloquer";
  di.addEventListener("change",function(){override=di.value||null;if(override)sset("date",override);else sdel("date");render()});
  ba.addEventListener("click",function(){forceAll=!forceAll;sset("all",forceAll?"1":"0");ba.textContent=forceAll?"Verrouiller selon la date":"Tout débloquer";render()});
  document.getElementById("dbg-reset").addEventListener("click",function(){opened={};saveOpened();render()});
  document.getElementById("dbg-clear").addEventListener("click",function(){try{Object.keys(localStorage).forEach(function(k){if(k.indexOf(NS+"cover-")===0)localStorage.removeItem(k)})}catch(e){}coverCache={};coverLog={};location.reload()});
  document.getElementById("dbg-real").addEventListener("click",function(){override=null;sdel("date");di.value="";render()});
}

/* ---------- neige ---------- */
(function(){
  var c=document.getElementById("snow"),x=c.getContext("2d"),f=[],W,H;
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  function rs(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;c.style.width=innerWidth+"px";c.style.height=innerHeight+"px"}
  rs();addEventListener("resize",rs);
  for(var i=0;i<70;i++)f.push({x:Math.random(),y:Math.random(),r:Math.random()*1.6+.4,s:Math.random()*.0006+.0002,w:Math.random()*6});
  (function loop(t){x.clearRect(0,0,W,H);x.fillStyle="rgba(243,236,220,.55)";
    f.forEach(function(p){p.y+=p.s;if(p.y>1)p.y=0;var px=(p.x+Math.sin(t/3000+p.w)*.01)*W;x.beginPath();x.arc(px,p.y*H,p.r*devicePixelRatio,0,7);x.fill()});
    requestAnimationFrame(loop)})(0);
})();

render();
// rafraîchit si la page reste ouverte au passage de minuit
setInterval(function(){var k=today().toDateString();if(k!==render._k){render._k=k;render()}},60000);render._k=today().toDateString();
})();
</script>
